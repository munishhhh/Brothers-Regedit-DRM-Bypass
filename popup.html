<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brothers Regedit DRM Bypass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <img src="icon.png" alt="Brothers Regedit" class="brand-logo" id="brand-logo">
                <div class="brand-info">
                    <span class="brand-name">Brothers Regedit</span>
                    <span class="version-badge" id="version-badge">DRM BYPASS 1.3</span>
                </div>
            </div>
            <div class="live-status-pill active" id="live-status-pill">
                <span class="status-dot" id="status-dot"></span>
                <span class="status-label" id="pill-label">ACTIVE</span>
            </div>
        </header>

        <!-- Main Bypass Control Card -->
        <main class="main-card" id="main-card">
            <div class="control-row">
                <div class="control-text">
                    <h2 id="status-text">DRM Bypass Active</h2>
                    <p class="control-desc" id="status-desc">Discord ScreenShare Black Screen Fix</p>
                </div>
                <label class="switch" title="Toggle DRM Bypass Protection">
                    <input type="checkbox" id="toggle-fix" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="refresh-hint" id="refresh-hint">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M2.13 15.57a10 10 0 1 0 0.57-8.38l5.67-5.67"></path>
                </svg>
                <span>Page reloaded to apply changes</span>
            </div>
        </main>

        <!-- Search Bar Section (Triggered by Others) -->
        <section class="search-section" id="search-section">
            <div class="search-bar-wrap">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="custom-search-input" placeholder="Type platform URL (e.g. aha.video)..." autocomplete="off">
                <button id="btn-go-search" title="Open Site">Go</button>
            </div>
            <div class="search-suggestions">
                <span class="tag" data-url="https://www.aha.video">AHA</span>
                <span class="tag" data-url="https://www.fancode.com">FanCode</span>
                <span class="tag" data-url="https://www.max.com">HBO Max</span>
                <span class="tag" data-url="https://open.spotify.com">Spotify</span>
            </div>
        </section>

        <!-- Quick Launch Platforms Grid -->
        <section class="platforms-section">
            <div class="section-header">
                <h3>Quick Launch Platforms</h3>
                <span class="section-badge">1-Click Open</span>
            </div>

            <div class="platform-grid">
                <!-- 1. JioHotstar -->
                <button class="platform-card hotstar" data-url="https://www.jiohotstar.com" title="Open JioHotstar">
                    <div class="platform-icon-wrap img-wrap">
                        <img src="hotstar.png" alt="JioHotstar" class="brand-img">
                    </div>
                    <span class="platform-name">JioHotstar</span>
                </button>

                <!-- 2. Netflix -->
                <button class="platform-card netflix" data-url="https://www.netflix.com" title="Open Netflix">
                    <div class="platform-icon-wrap img-wrap">
                        <img src="netflix.png" alt="Netflix" class="brand-img">
                    </div>
                    <span class="platform-name">Netflix</span>
                </button>

                <!-- 3. Prime Video -->
                <button class="platform-card prime" data-url="https://www.primevideo.com" title="Open Prime Video">
                    <div class="platform-icon-wrap img-wrap">
                        <img src="prime.png" alt="Prime Video" class="brand-img">
                    </div>
                    <span class="platform-name">Prime Video</span>
                </button>

                <!-- 4. Apple TV+ -->
                <button class="platform-card appletv" data-url="https://tv.apple.com" title="Open Apple TV+">
                    <div class="platform-icon-wrap img-wrap">
                        <img src="appletv.png" alt="Apple TV+" class="brand-img">
                    </div>
                    <span class="platform-name">Apple TV+</span>
                </button>

                <!-- 5. Zee5 -->
                <button class="platform-card zee5" data-url="https://www.zee5.com" title="Open Zee5">
                    <div class="platform-icon-wrap img-wrap">
                        <img src="zee5.png" alt="Zee5" class="brand-img">
                    </div>
                    <span class="platform-name">Zee5</span>
                </button>

                <!-- 6. Crunchyroll -->
                <button class="platform-card crunchyroll" data-url="https://www.crunchyroll.com" title="Open Crunchyroll">
                    <div class="platform-icon-wrap img-wrap">
                        <img src="crunchyroll.png" alt="Crunchyroll" class="brand-img">
                    </div>
                    <span class="platform-name">Crunchyroll</span>
                </button>

                <!-- 7. Disney+ -->
                <button class="platform-card disneyhotstar" data-url="https://www.hotstar.com" title="Open Disney+">
                    <div class="platform-icon-wrap img-wrap">
                        <img src="disneyhotstar.png" alt="Disney+" class="brand-img">
                    </div>
                    <span class="platform-name">Disney+</span>
                </button>

                <!-- 8. Others -->
                <button class="platform-card others" id="btn-others" title="Open Custom Platform Search">
                    <div class="platform-icon-wrap img-wrap">
                        <img src="others.png" alt="Others" class="brand-img">
                    </div>
                    <span class="platform-name">Others</span>
                </button>
            </div>
        </section>

        <!-- Footer with Dedicated Discord Icon Button -->
        <footer class="app-footer">
            <div class="footer-info">
                <a href="https://discord.gg/Qtj8wHjF6Z" class="discord-icon-link" id="btn-discord-logo" title="Join Brothers Regedit Discord Server">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.093.252-.19.372-.287a.075.075 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.195.373.288a.077.077 0 0 1-.006.127c-.6.33-1.226.63-1.873.89-.041.017-.06.066-.04.107.355.698.766 1.362 1.226 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                    </svg>
                </a>
                <span>Discord, OBS + More ScreenShare Fix</span>
            </div>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>

</html>
